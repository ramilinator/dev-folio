<body>

  <header id="header" class="header d-flex align-items-center">

  <main class="main">

          <!-- Search Box -->

          <ul class="portfolio-filters isotope-filters" data-aos="fade-up" data-aos-delay="200">
            <li id="showAll" data-filter="*" class="filter-active">
              <i class="bi bi-grid-3x3"></i> All Projects
            </li>
            <li id="showType1" data-filter=".filter-ui">
              UI/UX
            </li>
            <li id="showType2" data-filter=".filter-design">
              Web Design
            </li>
            <li id="showType3" data-filter=".filter-development">
              Development
            </li>
            <li id="showType4" data-filter=".filter-branding">
              Branding
            </li>
          </ul>


          <!-- Results -->
          <div id="results" class="row g-4 isotope-container" data-aos="fade-up" data-aos-delay="300"></div>


        </div>

    </section>

  <!-- Filter Buttons 
  <div class="btn-group">
    <button id="showAll">All Projects</button>
    <button id="showType1">UI/UX</button>
    <button id="showType2">Web Design</button>
    <button id="showType3">Web Development</button>
    <button id="showType4">Branding</button>
  </div>
  -->

  <!-- Handlebars Template -->
  <script id="results-template" type="text/x-handlebars-template">
    {{#if this.length}}
      {{#each this}}
        <div class="col-lg-4 col-md-6 portfolio-item-wrapper isotope-item filter-{{tag}}">
              <article class="portfolio-entry">
                <figure class="entry-image">
                  <a href="{{image}}" class="glightbox">
                    <img src="{{image}}" class="img-fluid" alt="" loading="lazy">
                  </a>
                </figure>
                <div class="entry-overlay">
                  <div class="overlay-content">
                    <div class="entry-meta">{{tag}}</div>
                    <div class="entry-links">
                      <h3 class="entry-title">{{title}}</h3>
                      <a class="{{#unless url}}disabled{{/unless}}" target="_blank" href={{url}}>
                        <i class="bi bi-arrow-right"></i>
                      </a>
                    </div>
                  </div>
                </div>
              </article>
            </div>
      {{/each}}
    {{else}}
      <p>No results found.</p>
    {{/if}}
  </script>

  <!-- Handlebars -->
  <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.min.js"></script>

  <script>

    const resultsDiv = document.getElementById("results");

    let localData = [];

    // Compile Handlebars template
    const source = document.getElementById("results-template").innerHTML;
    const template = Handlebars.compile(source);

    // Load local JSON
    fetch("data.json")
      .then(res => res.json())
      .then(data => {
        localData = data;
        render(localData); // show all initially
      })
      .catch(err => {
        console.error("Error loading JSON:", err);
        resultsDiv.innerHTML = "<p>Could not load local data.</p>";
      });

    // Main render with smooth transition
    function render(data) {
      const currentItems = resultsDiv.querySelectorAll(".portfolio-item-wrapper");

      if (currentItems.length > 0) {
        // Step 1: Add "hidden" class to fade and shrink items smoothly
        currentItems.forEach(item => {
          item.classList.remove("rendered");
          item.classList.add("hidden");
        });

        // Step 2: Wait for the fade-out before replacing items
        setTimeout(() => renderNewItems(data), 200);
      } else {
        renderNewItems(data);
      }
    }

    // Step 3: Render new items with organic staggered fade-in
    function renderNewItems(data) {
      resultsDiv.innerHTML = template(data);

      const items = resultsDiv.querySelectorAll(".portfolio-item-wrapper");

      // Start as initialize (invisible)
      items.forEach(item => item.classList.add("initialize"));

      // Fade in each item with random delay for organic feel
      items.forEach(item => {
        const randomDelay = 100; // 0.4–0.9s
        setTimeout(() => {
          item.classList.remove("initialize");
          item.classList.add("rendered");
        }, randomDelay);
      });
    }

    // Button filters
    document.getElementById("showAll").addEventListener("click", () => render(localData));
    document.getElementById("showType1").addEventListener("click", () => render(localData.filter(i => i.tag === "uiux")));
    document.getElementById("showType2").addEventListener("click", () => render(localData.filter(i => i.tag === "web design")));
    document.getElementById("showType3").addEventListener("click", () => render(localData.filter(i => i.tag === "develop")));
    document.getElementById("showType4").addEventListener("click", () => render(localData.filter(i => i.tag === "branding")));

  </script>
